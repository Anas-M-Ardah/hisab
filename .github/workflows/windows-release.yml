name: Build Windows release
on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/windows-release.yml', 'release.ps1', 'Setup-Guide-Arabic.pdf', 'Start-Hisab.cmd', 'ThirdParty/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hisab-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and package
        shell: pwsh
        run: ./release.ps1
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.3.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'حساب ٠٫٣ — Windows' --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          gh release upload $tag release/Hisab-Windows.zip Setup-Guide-Arabic.pdf --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
